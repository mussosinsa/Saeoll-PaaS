apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: istio-ingressgateway
  namespace: {ISTIO_NAMESPACE}
spec:
  profile: empty
  components:
    ingressGateways:
      - name: istio-ingressgateway
        label:
          istio: ingressgateway
          app: istio-ingressgateway
          topology.istio.io/network: {TG_NETWORK}
        enabled: true
        k8s:
          env:
            - name: ISTIO_META_ROUTER_MODE
              value: "sni-dnat"
            # The network to which traffic is routed
            - name: ISTIO_META_REQUESTED_NETWORK_VIEW
              value: {TG_NETWORK}
          service:
            ports:
              - name: status-port
                port: 15021
                targetPort: 15021
              - name: http2
                port: 80
                targetPort: 8080
              - name: https
                port: 443
                targetPort: 8443
              - name: tcp
                port: 31400
                targetPort: 31400
              - name: mtls
                port: 15443
                targetPort: 15443
              - name: tcp-istiod
                port: 15012
                targetPort: 15012
              - name: tcp-webhook
                port: 15017
                targetPort: 15017
  values:
    global:
      meshID: usmesh
      multiCluster:
        clusterName: {TG_CLUSTER_NAME}
      network: {TG_NETWORK}