# Default values for container platform certificate setup.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
metadata:
  name: {CP_CERT_SETUP_NAME}
  namespace: {CP_CERT_SETUP_NAMESPACE}

data:
  target:
    cert: cert
    script: mkdir -p /etc/pki/ca-trust/source/anchors && printf '%s\n' "$CA_CERT" > /etc/pki/ca-trust/source/anchors/{HOST_DOMAIN}.crt && chmod 0644 /etc/pki/ca-trust/source/anchors/{HOST_DOMAIN}.crt && update-ca-trust extract && for cr in crio containerd; do if systemctl is-enabled --quiet "$cr" 2> /dev/null; then systemctl restart "$cr"; fi; done
