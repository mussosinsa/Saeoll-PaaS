    CREATE DATABASE /*!32312 IF NOT EXISTS*/`cp` /*!40100 DEFAULT CHARACTER SET latin1 */;
    USE `cp`;

    -- ----------------------------
    -- Table structure for cp_cloud_accounts
    -- ----------------------------
    DROP TABLE IF EXISTS `cp_cloud_accounts`;
    CREATE TABLE IF NOT EXISTS `cp_cloud_accounts` (
    `id` bigint(20) NOT NULL AUTO_INCREMENT,
    `name` varchar(100) NOT NULL,
    `provider` varchar(100) NOT NULL DEFAULT 'AWS',
    `project` varchar(100) DEFAULT NULL,
    `region` varchar(100) DEFAULT NULL,
    `site` varchar(100) DEFAULT NULL,
    `created` varchar(255) NOT NULL,
    `last_modified` varchar(255) NOT NULL,
    PRIMARY KEY (`id`) USING BTREE
    ) ENGINE=InnoDB AUTO_INCREMENT=22 DEFAULT CHARSET=latin1 COMMENT = 'CLOUD_ACCOUNTS' ;


    -- ----------------------------
    -- Table structure for cp_clusters
    -- ----------------------------
    DROP TABLE IF EXISTS `cp_clusters`;
    CREATE TABLE IF NOT EXISTS `cp_clusters` (
    `cluster_id` varchar(255) NOT NULL COMMENT 'cluster id(클러스터 아이디)',
    `name` varchar(255) DEFAULT NULL COMMENT 'cluster name(클러스터 명)',
    `cluster_type` varchar(255) NOT NULL DEFAULT 'sub' COMMENT 'cluster type(클러스터 타입)',
    `created` varchar(255) NOT NULL COMMENT 'created(생성일)',
    `last_modified` varchar(255) NOT NULL COMMENT 'last modified(수정일)',
    `provider_type` varchar(50) NOT NULL DEFAULT 'AWS' COMMENT 'provider type(프로바이더 타입)',
    `description` varchar(255) NOT NULL COMMENT 'description(설명)',
    `status` varchar(1) NOT NULL DEFAULT 'D' COMMENT 'cluster status(클러스터 상태)',
    `ssh_key` varchar(100) DEFAULT NULL COMMENT 'ssh_key',
    PRIMARY KEY (`cluster_id`) USING BTREE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 ROW_FORMAT=DYNAMIC COMMENT='CLUSTERS';

