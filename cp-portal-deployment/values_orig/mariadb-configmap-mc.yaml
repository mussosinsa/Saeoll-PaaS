    DROP TABLE IF EXISTS `cp_hcl_templates`;
    CREATE TABLE IF NOT EXISTS `cp_hcl_templates` (
    `id` bigint(20) NOT NULL AUTO_INCREMENT,
    `name` varchar(100) NOT NULL,
    `provider` varchar(100) NOT NULL DEFAULT 'AWS',
    `hcl_script` text DEFAULT NULL,
    `region` varchar(100) DEFAULT NULL,
    `created` varchar(30) NOT NULL,
    `last_modified` varchar(255) NOT NULL,
    PRIMARY KEY (`id`) USING BTREE
    ) ENGINE=InnoDB AUTO_INCREMENT=22 DEFAULT CHARSET=latin1 COMMENT='HCL_TEMPLATES';

    -- ----------------------------
    -- Records of cp_hcl_templates
    -- ----------------------------
    INSERT INTO `cp_hcl_templates` (`name`, `provider`, `hcl_script`, `region`, `created`, `last_modified`) VALUES ('openstack-template', 'OPENSTACK', 'data "openstack_images_image_v2" "ubuntu" {\n  name = "ubuntu-20.04"\n}\n\ndata "openstack_compute_keypair_v2" "cp-keypair" {\n  name = "cp-opentofu-keypair"\n}\n\ndata "openstack_networking_floatingip_v2" "cp-floatingip-master" {\n  address = "0.0.0.0"                                                 // Set a floating ip \n}\ndata "openstack_networking_floatingip_v2" "cp-floatingip-worker" {\n  address = "0.0.0.0"                                                 // Set a floating ip \n}\n\ndata "openstack_networking_network_v2" "cp-network" {\n  name = "cp-network"\n}\n\ndata "openstack_networking_subnet_v2" "cp-subnet" {\n  name = "cp-subnet"\n}\n\ndata "openstack_networking_router_v2" "ext_route" {\n  name = "ext_route"\n}\n\ndata "openstack_networking_secgroup_v2" "cp-secgroup" {\n  name = "cp-secgroup"\n}\n\nresource "openstack_networking_router_interface_v2" "cp-router-interface" {\n  router_id = data.openstack_networking_router_v2.ext_route.id\n  subnet_id = data.openstack_networking_subnet_v2.cp-subnet.id\n}\n\nresource "openstack_compute_instance_v2" "opentofu-master-node" {\n  name              = "opentofu-master-node"\n  flavor_id         = "m1.large"\n  key_pair          = data.openstack_compute_keypair_v2.cp-keypair.id\n  security_groups   = [data.openstack_networking_secgroup_v2.cp-secgroup.id]\n  availability_zone = "octavia"\n  region            = "RegionOne"\n\n  block_device {\n    uuid                  = data.openstack_images_image_v2.ubuntu.id\n    source_type           = "image"\n    volume_size           = 80\n    boot_index            = 0\n    destination_type      = "volume"\n    delete_on_termination = true\n  }\n\n  network {\n    uuid = data.openstack_networking_network_v2.cp-network.id\n  }\n}\n\nresource "openstack_compute_instance_v2" "opentofu-worker-node" {\n  name              = "opentofu-worker-node"\n  flavor_id         = "m1.large"\n  key_pair          = data.openstack_compute_keypair_v2.cp-keypair.id\n  security_groups   = [data.openstack_networking_secgroup_v2.cp-secgroup.id]\n  availability_zone = "octavia"\n  region            = "RegionOne"\n\n  block_device {\n    uuid                  = data.openstack_images_image_v2.ubuntu.id\n    source_type           = "image"\n    volume_size           = 80\n    boot_index            = 0\n    destination_type      = "volume"\n    delete_on_termination = true\n  }\n\n  network {\n    uuid = data.openstack_networking_network_v2.cp-network.id\n  }\n}\n\nresource "openstack_compute_floatingip_associate_v2" "fip_1" {\n  floating_ip = data.openstack_networking_floatingip_v2.cp-floatingip-master.address\n  instance_id = "${openstack_compute_instance_v2.opentofu-master-node.id}"\n  wait_until_associated = true\n}\n\nresource "openstack_compute_floatingip_associate_v2" "fip_2" {\n  floating_ip = data.openstack_networking_floatingip_v2.cp-floatingip-worker.address\n  instance_id = "${openstack_compute_instance_v2.opentofu-worker-node.id}"\n  wait_until_associated = true\n}\n', '', CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR), CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR));
    INSERT INTO `cp_hcl_templates` (`name`, `provider`, `hcl_script`, `region`, `created`, `last_modified`) VALUES ('nhn-template', 'NHN', 'data "openstack_networking_network_v2" "cp-network" {\n  name = "Default Network"\n}\n\ndata "openstack_networking_subnet_v2" "cp-subnet" {\n  network_id = data.openstack_networking_network_v2.cp-network.id\n  name = "Default Network"\n}\n\ndata "openstack_networking_secgroup_v2" "cp-sg" {\n  name = "default"\n}\n\ndata "openstack_images_image_v2" "ubuntu_focal" {\n  name = "Ubuntu Server 22.04.5 LTS (2025.02.25)"                                                 // Update an image \n  most_recent = true\n}\n\ndata "openstack_networking_network_v2" "ext_network" {\n  name = "Public Network"\n}\n\nresource "openstack_networking_port_v2" "nic" {\n\n  name = "cp-nic01"\n network_id = data.openstack_networking_network_v2.cp-network.id\n  fixed_ip {\n    subnet_id = data.openstack_networking_subnet_v2.cp-subnet.id\n  }\n  security_group_ids = [\n    data.openstack_networking_secgroup_v2.cp-sg.id\n  ]\n}\n\nresource "openstack_networking_port_v2" "nic2" {\n\n  name = "cp-nic02"\n  network_id = data.openstack_networking_network_v2.cp-network.id\n  fixed_ip {\n    subnet_id = data.openstack_networking_subnet_v2.cp-subnet.id\n  }\n  security_group_ids = [\n    data.openstack_networking_secgroup_v2.cp-sg.id\n  ]\n}\n\nresource "openstack_compute_instance_v2" "vm-cp-master" {\n\n  name              = "cp-cluster-master"\n  availability_zone = "kr-pub-a"\n  flavor_name       = "m2.c4m8"\n  key_pair          = "nhn-cluster-key"\n\n  block_device {\n    uuid                  = data.openstack_images_image_v2.ubuntu_focal.id\n    source_type           = "image"\n    destination_type      = "volume"\n    delete_on_termination = true\n    volume_size           = 40\n    volume_type           = "General HDD"\n  }\n\n  network {\n    port = openstack_networking_port_v2.nic.id\n  }\n}\n\nresource "openstack_networking_floatingip_v2" "fip_1" {\n  pool       = data.openstack_networking_network_v2.ext_network.name\n}\n\nresource "openstack_compute_floatingip_associate_v2" "fip_1" {\n  floating_ip = openstack_networking_floatingip_v2.fip_1.address\n  instance_id = openstack_compute_instance_v2.vm-cp-master.id\n  wait_until_associated = true\n}\n\nresource "openstack_compute_instance_v2" "vm-cp-worker" {\n\n  name              = "cp-cluster-worker"\n  availability_zone = "kr-pub-a"\n  flavor_name       = "m2.c4m8"\n  key_pair          = "nhn-cluster-key"\n\n  block_device {\n    uuid                  = data.openstack_images_image_v2.ubuntu_focal.id\n    source_type           = "image"\n    destination_type      = "volume"\n    delete_on_termination = true\n    volume_size           = 40\n    volume_type           = "General HDD"\n  }\n\n  network {\n    port = openstack_networking_port_v2.nic2.id\n  }\n}\n\nresource "openstack_networking_floatingip_v2" "fip_2" {\n  pool       = data.openstack_networking_network_v2.ext_network.name\n}\nresource "openstack_compute_floatingip_associate_v2" "fip_2" {\n  floating_ip = openstack_networking_floatingip_v2.fip_2.address\n  instance_id = openstack_compute_instance_v2.vm-cp-worker.id\n  wait_until_associated = true\n}\n', '', CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR), CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR));
    INSERT INTO `cp_hcl_templates` (`name`, `provider`, `hcl_script`, `region`, `created`, `last_modified`) VALUES ('naver-template', 'NAVER', 'variable server_name01 {\n   default = "cp-master"\n }\n\n variable server_name02 {\n   default = "cp-worker"\n }\n\n variable client_ip {\n   default = "0.0.0.0"                                                 // Set a client ip \n }\n\n  resource "ncloud_login_key" "key_scn_01" {\n key_name = var.server_name01\n }\n\n resource "ncloud_vpc" "vpc_scn_01" {\n name            = var.server_name01\n ipv4_cidr_block = "10.0.0.0/16"\n }\n\n resource "ncloud_subnet" "subnet_scn_01" {\n name           = var.server_name01\n vpc_no         = ncloud_vpc.vpc_scn_01.id\n subnet         = cidrsubnet(ncloud_vpc.vpc_scn_01.ipv4_cidr_block, 8, 1)\n zone           = "KR-1"\n network_acl_no = ncloud_vpc.vpc_scn_01.default_network_acl_no\n subnet_type    = "PUBLIC"\n }\n\n resource "ncloud_network_interface" "nic01" {\n name                  = "server-nic1"\n description           = "for server-nic"\n subnet_no             = ncloud_subnet.subnet_scn_01.id\n access_control_groups = [ncloud_access_control_group.acg_scn_01.id]\n }\n\n resource "ncloud_network_interface" "nic02" {\n name                  = "server-nic2"\n description           = "for server-nic"\n subnet_no             = ncloud_subnet.subnet_scn_01.id\n access_control_groups = [ncloud_access_control_group.acg_scn_01.id]\n }\n\n resource "ncloud_server" "server_01_master" {\n subnet_no                 = ncloud_subnet.subnet_scn_01.id\n name                      = var.server_name01\n server_image_product_code = "SW.VSVR.OS.LNX64.UBNTU.SVR2004.B050"\n login_key_name            = ncloud_login_key.key_scn_01.key_name\n description = "master"\n network_interface {\n network_interface_no = ncloud_network_interface.nic01.id\n order                = 0\n }\n }\n\n resource "ncloud_server" "server_02" {\n subnet_no                 = ncloud_subnet.subnet_scn_01.id\n name                      = var.server_name02\n server_image_product_code = "SW.VSVR.OS.LNX64.UBNTU.SVR2004.B050"\n login_key_name            = ncloud_login_key.key_scn_01.key_name\n network_interface {\n   network_interface_no = ncloud_network_interface.nic02.id\n order                = 0\n }\n }\n\n  resource "ncloud_public_ip" "public_ip_01" {\n server_instance_no = ncloud_server.server_01_master.id\n description        = "for ${var.server_name01}"\n }\n\n resource "ncloud_public_ip" "public_ip_02" {\n server_instance_no = ncloud_server.server_02.id\n description        = "for ${var.server_name02}"\n }\n\n  locals {\n scn01_inbound = [\n [1, "TCP", "0.0.0.0/0", "80", "ALLOW"],\n [2, "TCP", "0.0.0.0/0", "443", "ALLOW"],\n [3, "TCP", "${var.client_ip}/32", "22", "ALLOW"],\n [4, "TCP", "0.0.0.0/0", "111", "ALLOW"],\n [5, "TCP", "0.0.0.0/0", "2049", "ALLOW"],\n [6, "TCP", "0.0.0.0/0", "6443", "ALLOW"],\n [7, "TCP", "0.0.0.0/0", "2379-2380", "ALLOW"],\n [8, "TCP", "0.0.0.0/0", "10250-10255", "ALLOW"],\n [9, "UDP", "0.0.0.0/0", "4789", "ALLOW"],\n [10, "TCP", "0.0.0.0/0", "30000-32767", "ALLOW"],\n [197, "TCP", "0.0.0.0/0", "1-65535", "ALLOW"],\n [198, "UDP", "0.0.0.0/0", "1-65535", "ALLOW"],\n [199, "ICMP", "0.0.0.0/0", null, "ALLOW"],\n ]\n\n scn01_outbound = [\n [1, "TCP", "0.0.0.0/0", "80", "ALLOW"],\n [2, "TCP", "0.0.0.0/0", "443", "ALLOW"],\n [3, "TCP", "${var.client_ip}/32", "1000-65535", "ALLOW"],\n [4, "TCP", "0.0.0.0/0", "30000-32767", "ALLOW"],\n [5, "UDP", "0.0.0.0/0", "30000-32767", "ALLOW"],\n [197, "TCP", "0.0.0.0/0", "1-65535", "ALLOW"],\n [198, "UDP", "0.0.0.0/0", "1-65535", "ALLOW"],\n [199, "ICMP", "0.0.0.0/0", null, "ALLOW"]\n ]\n }\n\n resource "ncloud_network_acl_rule" "network_acl_01_rule" {\n network_acl_no = ncloud_vpc.vpc_scn_01.default_network_acl_no\n dynamic "inbound" {\n for_each = local.scn01_inbound\n content {\n priority    = inbound.value[0]\n protocol    = inbound.value[1]\n    ip_block    = inbound.value[2]\n       port_range  = inbound.value[3]\n       rule_action = inbound.value[4]\n       description = "for ${var.server_name01}"\n     }\n   }\n\n    dynamic "outbound" {\n     for_each = local.scn01_outbound\n     content {\n       priority    = outbound.value[0]\n       protocol    = outbound.value[1]\n       ip_block    = outbound.value[2]\n       port_range  = outbound.value[3]\n       rule_action = outbound.value[4]\n       description = "for ${var.server_name01}"\n     }\n   }\n }\n\n  locals {\n   default_acg_rules_inbound = [\n     ["TCP", "0.0.0.0/0", "80"],\n     ["TCP", "0.0.0.0/0", "443"],\n     ["TCP", "0.0.0.0/0", "111"],\n     ["TCP", "0.0.0.0/0", "2049"],\n     ["TCP", "0.0.0.0/0", "2379-2380"],\n     ["TCP", "0.0.0.0/0", "6443"],\n     ["TCP", "0.0.0.0/0", "10250-10255"],\n     ["TCP", "0.0.0.0/0", "30000-32767"],\n     ["UDP", "0.0.0.0/0", "4789"],\n     ["TCP", "10.0.1.0/24", "22"],\n     ["TCP", "${var.client_ip}/32", "22"],\n     ["TCP", "0.0.0.0/0", "1-65535"],\n     ["UDP", "0.0.0.0/0", "1-65534"],\n     ["ICMP", "0.0.0.0/0", null]\n   ]\n\n    default_acg_rules_outbound = [\n     ["TCP", "0.0.0.0/0", "1-65535"],\n     ["UDP", "0.0.0.0/0", "1-65534"],\n     ["ICMP", "0.0.0.0/0", null]\n   ]\n }\n\n  resource "ncloud_access_control_group" "acg_scn_01" {\n      vpc_no      = ncloud_vpc.vpc_scn_01.id\n }\n  resource "ncloud_access_control_group_rule" "acg_rule_scn_01" {\n   access_control_group_no = ncloud_access_control_group.acg_scn_01.id\n\n    dynamic "inbound" {\n     for_each = local.default_acg_rules_inbound\n     content {\n       protocol    = inbound.value[0]\n       ip_block    = inbound.value[1]\n       port_range  = inbound.value[2]\n     }\n   }\n    dynamic "outbound" {\n     for_each = local.default_acg_rules_outbound\n     content {\n       protocol    = outbound.value[0]\n       ip_block    = outbound.value[1]\n       port_range  = outbound.value[2]\n     }\n   }\n }\n', '', CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR), CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR));
    INSERT INTO `cp_hcl_templates` (`name`, `provider`, `hcl_script`, `region`, `created`, `last_modified`) VALUES ('aws-template', 'AWS', 'data "aws_key_pair" "default_key" {\r\n  key_name = "cluster-name-key"\r\n}\r\nresource "aws_vpc" "aws-vpc" {\r\n  cidr_block = "172.10.0.0/20"\r\n  tags = {\r\n    Name = "cp-opentofu-vpc"\r\n  }\r\n}\r\nresource "aws_subnet" "cp-opentofu-subnet01" {\r\n  vpc_id = "${aws_vpc.aws-vpc.id}"\r\n  cidr_block = "172.10.0.0/24"\r\n  availability_zone = "ap-northeast-2a"\r\n  tags = {\r\n    Name = "cp-opentofu-subnet01"\r\n  }\r\n}\r\nresource "aws_subnet" "cp-opentofu-subnet02" {\r\n  vpc_id = "${aws_vpc.aws-vpc.id}"\r\n  cidr_block = "172.10.1.0/24"\r\n  availability_zone = "ap-northeast-2a"\r\n  tags = {\r\n    Name = "cp-opentofu-subnet02"\r\n  }\r\n}\r\nresource "aws_security_group" "cp-opentofu-sg-all" {\r\n  name = "cp-opentofu-sg-all"\r\n  description = "Allow all inbound traffic"\r\n  vpc_id = "${aws_vpc.aws-vpc.id}"\r\n  ingress {\r\n    from_port = 0\r\n    to_port = 0\r\n    protocol = "-1"\r\n    cidr_blocks = ["0.0.0.0/0"]\r\n  }\r\n  egress {\r\n    from_port = 0\r\n    to_port = 0\r\n    protocol = "-1"\r\n    cidr_blocks = ["0.0.0.0/0"]\r\n  }\r\n}\r\ndata "aws_ami" "ubuntu" {\r\n  most_recent = true\r\n  filter {\r\n    name = "name"\r\n    values = ["ubuntu/images/hvm-ssd/ubuntu-focal-20.04-amd64-server-*"]\r\n  }\r\n  filter {\r\n    name = "virtualization-type"\r\n    values = ["hvm"]\r\n  }\r\n  owners = ["099720109477"] # Canonical\r\n}\r\nresource "aws_instance" "master" {\r\n  ami = "${data.aws_ami.ubuntu.id}"\r\n  instance_type = "t3.medium"\r\n  key_name = data.aws_key_pair.default_key.key_name\r\n  subnet_id = "${aws_subnet.cp-opentofu-subnet01.id}"\r\n  vpc_security_group_ids = [\r\n    "${aws_security_group.cp-opentofu-sg-all.id}"\r\n    #data.aws_security_group.default.id\r\n  ]\r\n  associate_public_ip_address = true\r\n  tags = {\r\n    Name = "cp-opentofu-m"\r\n  }\r\n  provisioner "remote-exec" {\r\n    connection {\r\n        type = "ssh"\r\n        host = "${self.public_ip}"\r\n        user = "ubuntu"\r\n        private_key = file("~/.ssh/cluster-name-key.pem")\r\n        timeout = "1m"\r\n    }\r\n    inline = [\r\n      "cat .ssh/authorized_keys"\r\n    ]\r\n  }\r\n}\r\nresource "aws_instance" "worker" {\r\n  ami = "${data.aws_ami.ubuntu.id}"\r\n  instance_type = "t3.medium"\r\n  key_name = data.aws_key_pair.default_key.key_name\r\n  subnet_id = "${aws_subnet.cp-opentofu-subnet01.id}"\r\n  vpc_security_group_ids = [\r\n    "${aws_security_group.cp-opentofu-sg-all.id}"\r\n    #data.aws_security_group.default.id\r\n  ]\r\n  associate_public_ip_address = true\r\n  tags = {\r\n    Name = "cp-opentofu-w"\r\n  }\r\n  provisioner "remote-exec" {\r\n    connection {\r\n        type = "ssh"\r\n        host = "${self.public_ip}"\r\n        user = "ubuntu"\r\n        private_key = file("~/.ssh/cluster-name-key.pem")\r\n        timeout = "1m"\r\n    }\r\n    inline = [\r\n      "cat .ssh/authorized_keys"\r\n    ]\r\n  }\r\n}\r\nresource "aws_default_route_table" "nc-public" {\r\n  default_route_table_id = "${aws_vpc.aws-vpc.default_route_table_id}"\r\n  tags = { Name = "New Public Route Table" }\r\n}\r\nresource "aws_route_table" "nc-private" {\r\n  vpc_id = "${aws_vpc.aws-vpc.id}"\r\n  tags = { Name = "New Route Private Table" }\r\n}\r\nresource "aws_route_table_association" "aws_public_2a" {\r\n  subnet_id = "${aws_subnet.cp-opentofu-subnet01.id}"\r\n  route_table_id = "${aws_vpc.aws-vpc.default_route_table_id}"\r\n}\r\nresource "aws_route_table_association" "aws_private_2a" {\r\n  subnet_id = "${aws_subnet.cp-opentofu-subnet02.id}"\r\n  route_table_id = "${aws_vpc.aws-vpc.default_route_table_id}"\r\n}\r\nresource "aws_internet_gateway" "aws-igw" {\r\n  vpc_id = "${aws_vpc.aws-vpc.id}"\r\n  tags = { Name = "aws-vpc Internet Gateway" }\r\n}\r\nresource "aws_route" "aws_public" {\r\n  route_table_id         = "${aws_vpc.aws-vpc.default_route_table_id}"\r\n  destination_cidr_block = "0.0.0.0/0"\r\n  gateway_id             = "${aws_internet_gateway.aws-igw.id}"\r\n}\r\nresource "aws_eip" "aws_nat" {\r\n  vpc = true\r\n}\r\nresource "aws_nat_gateway" "aws-nat" {\r\n  allocation_id = "${aws_eip.aws_nat.id}"\r\n  subnet_id     = "${aws_subnet.cp-opentofu-subnet01.id}"\r\n}\r\nresource "aws_route" "aws_private" {\r\n    route_table_id         = "${aws_route_table.nc-private.id}"\r\n    destination_cidr_block = "0.0.0.0/0"\r\n    nat_gateway_id         = "${aws_nat_gateway.aws-nat.id}"\r\n}', '', CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR), CONVERT(date_format(NOW(), '%Y-%m-%d %T') , CHAR));

    -- ----------------------------
    -- Table structure for cp_limit_ranges
    -- ----------------------------
    DROP TABLE IF EXISTS `cp_limit_ranges`;
    CREATE TABLE IF NOT EXISTS `cp_limit_ranges` (
    `id` bigint(20) NOT NULL AUTO_INCREMENT COMMENT 'id(아이디)',
    `default_limit` varchar(255) DEFAULT NULL COMMENT 'default limit(기본 상한 값)',
    `default_request` varchar(255) DEFAULT NULL COMMENT 'default request(기본 요청 값)',
    `max` varchar(255) DEFAULT NULL COMMENT 'max(컨테이너에 지정할 리밋레인지 최대 값)',
    `min` varchar(255) DEFAULT NULL COMMENT 'min(컨테이너에 지정할 리밋레인지 최소 값)',
    `name` varchar(255) DEFAULT NULL COMMENT 'name(리밋 레인지 명)',
    `resource` varchar(255) DEFAULT NULL COMMENT 'resource(리밋 레인지 리소스)',
    `type` varchar(255) DEFAULT NULL COMMENT 'type(리밋 레인지 유형)',
    `created` varchar(255) NOT NULL COMMENT 'created(생성일)',
    PRIMARY KEY (`id`) USING BTREE
    ) ENGINE=InnoDB AUTO_INCREMENT=7 DEFAULT CHARSET=latin1 ROW_FORMAT=DYNAMIC COMMENT='LIMIT_RANGES';

    -- ----------------------------
    -- Records of cp_limit_ranges
    -- ----------------------------
    INSERT INTO `cp_limit_ranges`(`id`, `default_limit`, `default_request`, `max`, `min`, `name`, `resource`, `type`, `created`) VALUES (1, '100m', '-', '-', '-', 'cp-low-limitrange', 'cpu', 'Container', DATE_FORMAT(NOW(), '%Y-%m-%d %T'));
    INSERT INTO `cp_limit_ranges`(`id`, `default_limit`, `default_request`, `max`, `min`, `name`, `resource`, `type`, `created`) VALUES (2, '500Mi', '-', '-', '-', 'cp-low-limitrange', 'memory', 'Container', DATE_FORMAT(NOW(), '%Y-%m-%d %T'));
    INSERT INTO `cp_limit_ranges`(`id`, `default_limit`, `default_request`, `max`, `min`, `name`, `resource`, `type`, `created`) VALUES (3, '300m', '-', '-', '-', 'cp-medium-limitrange', 'cpu', 'Container', DATE_FORMAT(NOW(), '%Y-%m-%d %T'));
