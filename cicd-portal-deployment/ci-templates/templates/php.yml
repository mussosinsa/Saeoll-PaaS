# PHP (Composer). Lint all PHP files, run phpunit when installed.
#   PHP_BUILD_IMAGE (default $CICD_DOCKERHUB/composer:2)
include:
  - local: /templates/common.yml

variables:
  PHP_BUILD_IMAGE: $CICD_DOCKERHUB/composer:2
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer-cache

.php:
  image: $PHP_BUILD_IMAGE
  cache:
    key: composer-$CI_PROJECT_ID
    paths: [.composer-cache]

build:
  extends: .php
  stage: build
  script:
    - composer validate --no-check-publish
    - composer install --no-interaction --no-progress --prefer-dist
    - find . -path ./vendor -prune -o -path ./.composer-cache -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

test:
  extends: .php
  stage: test
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - |
      if [ -x vendor/bin/phpunit ]; then
        vendor/bin/phpunit --log-junit phpunit-report.xml
      else
        echo "phpunit is not installed (require-dev) - unit tests skipped"
      fi
  artifacts:
    when: always
    reports:
      junit: phpunit-report.xml
