# Common stages for every language template (included by <language>.yml).
#
# Flow
#   any branch / merge request : build + test
#   develop                    : + image (dev-<sha>-<pipeline>) + gitops dev overlay  -> Argo CD auto sync
#   tag vX.Y.Z (Maintainers)   : + image (vX.Y.Z)              + gitops prod overlay -> Argo CD manual sync
#
# Variables
#   instance : HARBOR_HOST CICD_DOCKERHUB CICD_BASE_REGISTRY KANIKO_IMAGE CICD_CA_FILE GITOPS_HOST
#   group    : HARBOR_USER HARBOR_PASSWORD GITOPS_TOKEN   (onboard-vendor.sh)
#   project  : APP_NAME (default: project name), DOCKERFILE, DOCKER_CONTEXT
#   security : CICD_SECURITY_IMAGE (instance, ./deploy-cicd-portal.sh security), CICD_APP_TYPE (<language>.yml),
#              DEFECTDOJO_URL / DEFECTDOJO_TOKEN (instance, optional)
#
# Security (when CICD_SECURITY_IMAGE is set): Semgrep, Gitleaks, Trivy (dependencies + image), personal
# information. Policy and rules: ConfigMaps mounted by the runner (CI/CD console > 품질 관리).
#   gate pass -> deploy / limits exceeded in report mode -> warning (exit 10, allowed) / enforce mode -> no deploy
stages: [build, test, package, security, deploy]

variables:
  APP_NAME: $CI_PROJECT_NAME
  IMAGE_REPO: $HARBOR_HOST/$CI_PROJECT_ROOT_NAMESPACE/$CI_PROJECT_NAME
  DOCKERFILE: Dockerfile
  DOCKER_CONTEXT: .

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"          # always deploys, even with an open MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.release-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      variables: { DEPLOY_ENV: dev }
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      variables: { DEPLOY_ENV: prod }

image:
  stage: package
  extends: .release-rules
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then IMAGE_TAG="$CI_COMMIT_TAG"; else IMAGE_TAG="dev-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_IID"; fi
      AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_HOST" "$AUTH" > /kaniko/.docker/config.json
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/$DOCKER_CONTEXT" \
        --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE" \
        --destination "$IMAGE_REPO:$IMAGE_TAG" \
        --build-arg "BASE_REGISTRY=$CICD_BASE_REGISTRY" \
        --registry-certificate "$HARBOR_HOST=$CICD_CA_FILE" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      echo "IMAGE_TAG=$IMAGE_TAG" > image.env
      echo "Pushed $IMAGE_REPO:$IMAGE_TAG"
  artifacts:
    reports:
      dotenv: image.env

security:
  stage: security
  image: $CICD_SECURITY_IMAGE
  needs:
    - job: image
      optional: true
  rules:
    - if: $CICD_SECURITY_IMAGE
  variables:
    CICD_APP: $CI_PROJECT_ROOT_NAMESPACE/$CI_PROJECT_NAME
    CICD_REF: $CI_COMMIT_REF_NAME
    CICD_COMMIT: $CI_COMMIT_SHA
    CICD_BUILD_URL: $CI_PIPELINE_URL
    TRIVY_USERNAME: $HARBOR_USER
    TRIVY_PASSWORD: $HARBOR_PASSWORD
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then export CICD_ENV=prod
      elif [ "$CI_COMMIT_BRANCH" = develop ]; then export CICD_ENV=dev
      else export CICD_ENV=branch; fi
      cicd-scan source --dir "$CI_PROJECT_DIR" --out security
      if [ -n "${IMAGE_TAG:-}" ]; then
        export CICD_IMAGE="$IMAGE_REPO:$IMAGE_TAG"
        cicd-scan image --image "$CICD_IMAGE" --out security
      fi
      rc=0
      cicd-scan gate --out security || rc=$?
      cicd-scan upload --out security || true
      exit $rc
  allow_failure:
    exit_codes: [10]
  artifacts:
    when: always
    expire_in: 90 days
    paths: [security/]

deploy:
  stage: deploy
  extends: .release-rules
  image: $CICD_DOCKERHUB/alpine:3.20
  needs:
    - image
    - job: security
      optional: true
  resource_group: gitops-$CI_PROJECT_ROOT_NAMESPACE
  environment:
    name: $DEPLOY_ENV
  script:
    - command -v git >/dev/null || apk add --no-cache git
    - |
      set -e
      OVERLAY="apps/$APP_NAME/overlays/$DEPLOY_ENV/kustomization.yaml"
      git config --global user.name "GitLab CI"
      git config --global user.email "ci@$GITOPS_HOST"
      git clone --depth 1 "http://gitops-ci:$GITOPS_TOKEN@$GITOPS_HOST/$CI_PROJECT_ROOT_NAMESPACE/gitops.git" gitops
      cd gitops
      [ -f "$OVERLAY" ] || { echo "$OVERLAY not found - run add-app.sh for $APP_NAME"; exit 1; }
      for attempt in 1 2 3; do
        sed -i "s|^\(    newTag:\).*|\1 $IMAGE_TAG|" "$OVERLAY"
        git add "$OVERLAY"
        git diff --cached --quiet && { echo "Already at $IMAGE_TAG"; exit 0; }
        git commit -m "$APP_NAME $DEPLOY_ENV -> $IMAGE_TAG ($CI_PROJECT_PATH@$CI_COMMIT_SHORT_SHA)"
        git push origin HEAD:main && break
        git fetch --depth 1 origin main && git reset --hard origin/main
        [ "$attempt" = 3 ] && exit 1
      done
      echo "gitops $OVERLAY -> $IMAGE_TAG"
      if [ "$DEPLOY_ENV" = prod ]; then
        echo "Production: sync '$CI_PROJECT_ROOT_NAMESPACE-$APP_NAME-prod' in Argo CD (cicd-admins) to release."
      fi
