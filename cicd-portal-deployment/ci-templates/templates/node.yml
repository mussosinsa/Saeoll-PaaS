# Node.js (npm). npm ci when package-lock.json exists, then test/build scripts if defined.
#   NODE_BUILD_IMAGE (default $CICD_DOCKERHUB/node:20-alpine)
include:
  - local: /templates/common.yml

variables:
  NODE_BUILD_IMAGE: $CICD_DOCKERHUB/node:20-alpine
  npm_config_cache: $CI_PROJECT_DIR/.npm

.node:
  image: $NODE_BUILD_IMAGE
  before_script:
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
  cache:
    key: npm-$CI_PROJECT_ID
    paths: [.npm]

build:
  extends: .node
  stage: build
  script:
    - npm run build --if-present

test:
  extends: .node
  stage: test
  script:
    - npm run lint --if-present
    - npm test --if-present
