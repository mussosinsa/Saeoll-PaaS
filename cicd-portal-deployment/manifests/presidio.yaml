# Presidio analyzer for the personal information check of the pipelines (phase 4, SECURITY_PRESIDIO=true).
# cicd-scan sends source files to POST /analyze with the Korean patterns as ad-hoc recognizers.
# Label cp-role: shared - the K-PaaS default NetworkPolicy then admits the build pods of cicd-jenkins / cicd-runner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  namespace: {NAMESPACE}
  labels:
    app: presidio-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-analyzer
  template:
    metadata:
      labels:
        app: presidio-analyzer
        cp-role: shared
    spec:
      containers:
        - name: analyzer
          image: {PRESIDIO_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  namespace: {NAMESPACE}
spec:
  selector:
    app: presidio-analyzer
  ports:
    - name: http
      port: 3000
      targetPort: http
