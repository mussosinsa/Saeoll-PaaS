server.port=8080
spring.application.name=spring-board
# MariaDB from environment variables (Kubernetes Secret <app>-db via envFrom)
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:board}
spring.datasource.username=${DB_USER:board}
spring.datasource.password=${DB_PASSWORD:}
# Start (and answer /healthz) even while the database is down; connect on first use
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
server.shutdown=graceful
