# Dedicated MariaDB for {APP} (add-db.sh <vendor> {APP} <env> dedicated).
# Rendered into <vendor>-gitops apps/{APP}/overlays/<env>/mariadb.yaml; the namespace comes from that
# overlay. Credentials: Secrets {APP}-db and {APP}-mariadb-root created by add-db.sh (not in Git).
# MariaDB creates the database and user from them on its first start (empty volume) only.
apiVersion: v1
kind: Service
metadata:
  name: {APP}-mariadb
  labels:
    app: {APP}-mariadb
spec:
  selector:
    app: {APP}-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {APP}-mariadb
  labels:
    app: {APP}-mariadb
spec:
  serviceName: {APP}-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: {APP}-mariadb
  template:
    metadata:
      labels:
        app: {APP}-mariadb
    spec:
      containers:
        - name: mariadb
          image: {MARIADB_IMAGE}
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports:
            - name: mysql
              containerPort: 3306
          env:
            # The official image creates the database and user on the first start (empty volume)
            - name: MARIADB_DATABASE
              valueFrom: {secretKeyRef: {name: {APP}-db, key: DB_NAME}}
            - name: MARIADB_USER
              valueFrom: {secretKeyRef: {name: {APP}-db, key: DB_USER}}
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: {APP}-db, key: DB_PASSWORD}}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {APP}-mariadb-root, key: password}}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {STORAGECLASS}             # add-db.sh: removed when empty (cluster default)
        resources:
          requests:
            storage: {DB_SIZE}
