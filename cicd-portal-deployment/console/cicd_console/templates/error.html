{% extends "base.html" %}
{% block title %}오류 {{ code }}{% endblock %}
{% block content %}
<div class="panel empty">
  <h1>{{ {400: '잘못된 요청', 401: '로그인 필요', 403: '권한 없음', 404: '찾을 수 없음', 502: '연동 시스템 오류'}.get(code, '오류') }} <span class="dim">{{ code }}</span></h1>
  <p>{{ message }}</p>
  <p><a class="btn" href="{{ url_for('main.dashboard') }}">대시보드로</a></p>
</div>
{% endblock %}
