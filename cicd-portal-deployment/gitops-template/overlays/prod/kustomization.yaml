# {VENDOR}/{APP} prod. CI updates images[0].newTag; Argo CD application {VENDOR}-{APP}-prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {PROD_NAMESPACE}
{PROD_LAYOUT}resources:
  - ../../base
images:
  - name: app
    newName: {IMAGE_REPO}
    newTag: none-yet
replicas:
  - name: {APP}
    count: 2
patches:
{PROD_EXPOSE_PATCH}
