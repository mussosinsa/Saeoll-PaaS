# {VENDOR}/{APP} dev. CI updates images[0].newTag; Argo CD application {VENDOR}-{APP}-dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {DEV_NAMESPACE}
{DEV_LAYOUT}resources:
  - ../../base
images:
  - name: app
    newName: {IMAGE_REPO}
    newTag: none-yet
replicas:
  - name: {APP}
    count: 1
patches:
{DEV_EXPOSE_PATCH}
