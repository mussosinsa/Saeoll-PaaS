apiVersion: apps/v1
kind: Deployment
metadata:
  name: {APP}
  labels:
    app: {APP}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: {APP}
  template:
    metadata:
      labels:
        app: {APP}
    spec:
      imagePullSecrets:
        - name: harbor-cicd
      containers:
        - name: {APP}
          image: app            # replaced by the overlay (images.newTag is set by CI)
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: {HEALTH_PATH}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {HEALTH_PATH}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
