apiVersion: apps/v1
kind: Deployment
metadata:
  name: {APP}
  labels:
    app: {APP}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: {APP}
  template:
    metadata:
      labels:
        app: {APP}
    spec:
      imagePullSecrets:
        - name: harbor-cicd
      containers:
        - name: {APP}
          image: app            # replaced by the overlay (images.newTag is set by CI or the image deploy job)
          ports:
            - name: http
              containerPort: {APP_PORT}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: {APP_MEMORY_LIMIT}
{PROBES}
