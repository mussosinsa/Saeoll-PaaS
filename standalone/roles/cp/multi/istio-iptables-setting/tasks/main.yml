---
- name: Install Rocky Linux iptables service
  dnf:
    name: iptables-services
    state: present
    update_cache: true

- name: Apply NAT PREROUTING DNAT rules for Istio multi-cluster
  shell: |
    iptables -t nat -I PREROUTING -d {{ item.0 }} -j DNAT --to-destination {{ item.1 }}
  with_together:
    - "{{ istio_gateway_private_ip_list }}"
    - "{{ istio_gateway_public_ip_list }}"
  when: item.0 != item.1

- name: Persist Istio NAT rules and enable the iptables service
  shell: |
    iptables-save > /etc/sysconfig/iptables
    systemctl enable --now iptables.service
